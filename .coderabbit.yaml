# CodeRabbit Configuration
# https://docs.coderabbit.ai/guides/configuration

language: en-US

reviews:
  # Automatic review settings
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - master
      - develop

  # Request changes when issues found
  request_changes_workflow: true

  # Generate high-level summary
  high_level_summary: true

  # Poem in review (fun)
  poem: false

  # Review profile (chill or assertive)
  profile: chill

  # Path filters - exclude from review
  path_filters:
    - "!**/node_modules/**"
    - "!**/__pycache__/**"
    - "!**/dist/**"
    - "!**/*.lock"
    - "!**/uv.lock"
    - "!**/poetry.lock"
    - "!**/_archive/**"
    - "!**/htmlcov/**"
    - "!**/.coverage"
    - "!**/coverage.xml"

  # Path-specific review instructions
  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        Review for Python best practices:
        - Proper type annotations
        - Docstrings for public functions/classes
        - Error handling with specific exceptions
        - No hardcoded secrets or credentials
        - Async/await patterns where appropriate
        - Pydantic models for data validation

    - path: "tests/**/*.py"
      instructions: |
        Review test quality:
        - Test coverage for edge cases
        - Proper use of fixtures and mocking
        - Clear test names describing behavior
        - No hardcoded test data that could be secrets

    - path: "src/podcast_pipeline/cli.py"
      instructions: |
        Review CLI design:
        - Clear help text for all commands
        - Proper error messages for users
        - Consistent command naming
        - Exit codes for scripting

    - path: "src/podcast_pipeline/providers/**"
      instructions: |
        Review AI provider integration:
        - Proper error handling for API failures
        - Rate limiting considerations
        - Fallback behavior implementation
        - No exposed API keys

    - path: ".github/**"
      instructions: |
        Review CI/CD configuration:
        - Security best practices
        - Minimal permissions
        - Proper caching
        - No hardcoded secrets

# Chat settings
chat:
  auto_reply: true

# Enable tools (using valid CodeRabbit schema)
tools:
  shellcheck:
    enabled: true
  yamllint:
    enabled: true
  markdownlint:
    enabled: true
  ruff:
    enabled: true
  gitleaks:
    enabled: true
