[project]
name = "podcast-pipeline"
version = "0.1.0"
description = "AI-powered podcast production pipeline for multi-platform content"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Podcast Pipeline Team" }]
keywords = ["podcast", "video", "audio", "ai", "transcription", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # Core audio/video processing
    "faster-whisper>=1.1.0",
    "pyloudnorm>=0.1.1",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",

    # AI Providers
    "google-genai>=1.0.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",

    # CLI & Config
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",

    # UI
    "streamlit>=1.42.0",

    # Utilities
    "structlog>=24.4.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.32.0",
]

[project.scripts]
podcast-pipeline = "podcast_pipeline.cli:app"

[project.urls]
Repository = "https://github.com/Beaulewis1977/podcast-pipeline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_pipeline"]

# ============================================================================
# Ruff - Linting & Formatting
# ============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "ARG",    # flake8-unused-arguments
    "DTZ",    # flake8-datetimez
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "TRY",    # tryceratops
    "ASYNC",  # flake8-async
]
ignore = [
    "E501",    # line length handled by formatter
    "S101",    # allow assert in tests
    "PLR2004", # magic values okay in some places
    "TRY003",  # long exception messages are fine
    "TRY300",  # try-except in loop is intentional
    "PLR0915", # too many statements is acceptable for complex stages
    "PLW2901", # loop variable overwritten is intentional
    "SIM102",  # nested if is sometimes clearer
    "SIM108",  # ternary is not always clearer
    "S603",    # subprocess calls are trusted
    "S110",    # try-except-pass for cleanup is acceptable
    "ARG001",  # unused args in callbacks/overrides
    "ARG002",  # unused args in interface methods
    "RUF012",  # ClassVar not needed for constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "ARG",     # unused arguments in fixtures
    "PLR2004", # magic values in tests
    "PLC0415", # imports inside tests for isolation
]
"src/podcast_pipeline/cli.py" = [
    "T20",     # print allowed in CLI
    "PLR0912", # complexity in CLI commands is acceptable
    "PLR0913", # many args in CLI commands is acceptable
    "PLC0415", # lazy imports for CLI performance
    "S603",    # subprocess with trusted input (streamlit)
]
"src/podcast_pipeline/models/job.py" = [
    "PLR0913", # many args needed for state updates
]
"src/podcast_pipeline/pipeline.py" = [
    "RUF012",  # class constant doesn't need ClassVar
]
"src/podcast_pipeline/providers/*.py" = [
    "PLC0415", # lazy imports for optional dependencies
    "TRY301",  # raise in try blocks is intentional
    "S110",    # try-except-pass for cleanup is acceptable
    "SIM105",  # prefer explicit try-except for clarity
]
"src/podcast_pipeline/stages/*.py" = [
    "PLC0415", # lazy imports for optional dependencies
    "TRY301",  # raise in try blocks is intentional
    "PLR0912", # complexity in stages is acceptable
    "PLR0913", # many args in stages is acceptable
]
"src/podcast_pipeline/research/*.py" = [
    "PLC0415", # lazy imports
    "PLR0912", # complexity acceptable
    "PLR0913", # many args acceptable
]
"src/podcast_pipeline/ui/*.py" = [
    "PLC0415", # lazy imports for streamlit
    "PLR0912", # complexity in UI is acceptable
    "PLR0913", # many args acceptable
    "S110",    # try-except-pass for cleanup is acceptable
]
"src/podcast_pipeline/utils/*.py" = [
    "PLC0415", # lazy imports
    "S603",    # subprocess calls are trusted internal utilities
]

[tool.ruff.lint.isort]
known-first-party = ["podcast_pipeline"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================================
# MyPy - Type Checking
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
strict = false

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "pydub.*",
    "pyloudnorm.*",
    "soundfile.*",
    "streamlit.*",
]
ignore_missing_imports = true

# ============================================================================
# Pytest - Testing
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests requiring GPU",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# ============================================================================
# Coverage
# ============================================================================
[tool.coverage.run]
source = ["src/podcast_pipeline"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 38  # Actual coverage requires FFmpeg/AI mocks for full testing
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]
