# Pre-commit hooks for podcast-pipeline
# Install: pre-commit install && pre-commit install --hook-type pre-push
# Run all: pre-commit run --all-files

default_stages: [pre-commit]
fail_fast: false

repos:
  # ==========================================================================
  # Code Quality - Ruff (lint + format)
  # ==========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff format

  # ==========================================================================
  # Type Checking - MyPy
  # ==========================================================================
  - repo: local
    hooks:
      - id: mypy
        name: mypy type check
        entry: bash -c 'uv run --quiet mypy src/'
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

  # ==========================================================================
  # General File Hygiene
  # ==========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: end-of-file-fixer
        name: fix end of files
      - id: check-yaml
        name: check yaml syntax
        args: [--unsafe]  # allows custom tags
      - id: check-toml
        name: check toml syntax
      - id: check-json
        name: check json syntax
      - id: check-added-large-files
        name: check for large files
        args: [--maxkb=1000]
      - id: check-merge-conflict
        name: check for merge conflicts
      - id: check-case-conflict
        name: check for case conflicts
      - id: detect-private-key
        name: detect private keys
      - id: check-executables-have-shebangs
        name: check executables have shebangs
      - id: check-shebang-scripts-are-executable
        name: check shebang scripts are executable

  # ==========================================================================
  # Security - Gitleaks (secret scanning)
  # ==========================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks detect secrets

  # ==========================================================================
  # Commit Message - Conventional Commits
  # ==========================================================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        name: conventional commit message
        stages: [commit-msg]
        args: [--strict]

  # ==========================================================================
  # Pre-Push Hooks - Tests
  # ==========================================================================
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest (pre-push)
        entry: uv run pytest tests/ -x --tb=short -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: pip-audit
        name: pip-audit security check (pre-push)
        # Ignore pip CVE-2026-1703 (meta-dependency we can't control)
        entry: uv run pip-audit --ignore-vuln CVE-2026-1703
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
